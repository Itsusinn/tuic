[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
authors = ["Itsusinn <sun@ihsin.dev>"]
version = "2.0.0-dev7"
rust-version = "1.85.0"
edition = "2024"
readme = "README.md"
description = "TUIC proxy protocol implementation"
license = "GPL-3.0-or-later"
repository = "https://github.com/Itsusinn/tuic"

[workspace.dependencies]
quinn = { branch = "bbrv3", git = "https://github.com/Tipuch/quinn.git", default-features = false }
quinn-proto = { branch = "bbrv3", git = "https://github.com/Tipuch/quinn.git", default-features = false }
quinn-congestions = { git = "https://github.com/proxy-rs/quinn-congestions.git", default-features = false}

# Patch into the Wind quiche fork instead of the crates.io releases:
# `datagram-socket` fixes the musl build with libc >= 0.2.169, and
# `tokio-quiche` carries the 32-bit fix plus the `quiche_internal` feature that
# `wind-quic` enables. `[patch]` is only honored in the root workspace manifest,
# so it cannot be inherited from the Wind Git dependency and must be repeated
# here. Keep this `rev` in sync with the `forks/quiche` submodule commit recorded
# by the Wind revision pinned in the `wind-*` dependencies of the member crates.
[patch.crates-io]
datagram-socket = { git = "https://github.com/rust-proxy/quiche", rev = "ed27ae7d3418c627bec8d2ec4d88945618edeb92" }
tokio-quiche = { git = "https://github.com/rust-proxy/quiche", rev = "ed27ae7d3418c627bec8d2ec4d88945618edeb92" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "warn"
cast_lossless = "warn"
ptr_as_ptr = "warn"
missing_safety_doc = "warn"
cloned_instead_of_copied = "warn"

[profile.release]
opt-level = "z"
debug = 1
lto = "fat"
strip = true
incremental = false
codegen-units = 1
