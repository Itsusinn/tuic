[package]
name = "tuic-tests"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["aws-lc-rs"]
ring = ["wind-tuic/ring", "rustls/ring", "tuic-client/ring", "tuic-server/ring"]
aws-lc-rs = ["wind-tuic/aws-lc-rs", "dep:aws-lc-rs", "rustls/aws-lc-rs", "tuic-client/aws-lc-rs", "tuic-server/aws-lc-rs"]
# Mirrors the opt-in tokio-quiche backend of `tuic-server`/`tuic-client`; the
# two crates and `wind-tuic` already enable it per target below, so this
# feature only forwards it to the benchmark harness, which uses it to gate the
# quiche end-to-end bench cases.
quiche = ["wind-tuic/quiche"]
# The HTTP/3 masquerade e2e test (`tests/masquerade.rs`) and the reqwest HTTP/3
# client it probes with, off by default.
#
# reqwest's `http3` feature is *unconditionally unstable*: it carries a
# `compile_error!` unless the crate is built with `--cfg reqwest_unstable`, and
# that cfg reaches the dependency graph only through rustflags. The workspace
# sets it in `.cargo/config.toml [build] rustflags`, but `cargo codspeed build`
# overrides the workspace rustflags with its own `CARGO_ENCODED_RUSTFLAGS`, so
# any build of this crate that pulls reqwest's `http3` in fails there (the
# benchmark target builds this crate's whole dev-dependency graph). Gating it
# behind a feature keeps the default and the CodSpeed build free of it; a build
# that wants the test must enable this feature *and* supply the cfg, e.g.
# `RUSTFLAGS='--cfg reqwest_unstable' cargo test -p tuic-tests --features masquerade-test`.
masquerade-test = ["dep:reqwest", "dep:http"]

[dependencies]
wind-core = { git = "https://github.com/rust-proxy/wind", rev = "12fbf7a690a4f20be6c9c593addf42a670cfc1a5" }
wind-quic = { git = "https://github.com/rust-proxy/wind", rev = "12fbf7a690a4f20be6c9c593addf42a670cfc1a5", default-features = false, features = ["quinn"] }
tuic-client = { path = "../tuic-client", default-features = false }
tuic-server = { path = "../tuic-server", default-features = false }
wind-tuic = { git = "https://github.com/rust-proxy/wind", rev = "12fbf7a690a4f20be6c9c593addf42a670cfc1a5", default-features = false, features = ["server", "client", "quinn", "masquerade"] }

bytes = "1"
json5 = { version = "1.3" }
lexopt = { version = "0.3" }
eyre = { version = "0.6" }
async-trait = "0.1"
fast-socks5 = { version = "1" }
rustls = { version = "0.23", default-features = false }
tracing-test = { version = "0.2" }
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
aws-lc-rs = { version = "1", default-features = false, optional = true, features = ["prebuilt-nasm"] }
uuid = "1"
serde_json = { version = "1", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", features = ["codec"] }

# HTTP/3 client for the masquerade e2e test (tests/masquerade.rs), behind the
# `masquerade-test` feature; see that feature's comment for why it cannot be an
# unconditional dependency (and why it cannot live in `[dev-dependencies]`,
# which cargo forbids from being optional).
reqwest = { version = "0.12", default-features = false, features = ["http3", "rustls-tls"], optional = true }
http = { version = "1", optional = true }

[dev-dependencies]
# `benches/codspeed.rs`: the CodSpeed-facing harness. The crate is the
# `codspeed-criterion-compat` mirror of `criterion`, so `cargo bench` and
# `cargo codspeed run` execute the same benchmark functions.
criterion = { version = "5.0.2", package = "codspeed-criterion-compat" }

# `tests/tls_options.rs`: a recording `ResolvesServerCert` needs rustls' server
# and signing traits, and `tempfile`/`rustls-pemfile` cover the certificate
# plumbing the test builds.
rustls-pemfile = { version = "2", default-features = false, features = ["std"] }
tempfile = "3"

# `reqwest_unstable` is a rustc cfg (set in the workspace `.cargo/config.toml`)
# that gates reqwest's experimental HTTP/3 client; declare it so a build that
# sets it isn't flagged as an unknown cfg.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(reqwest_unstable)'] }

[[bench]]
name = "codspeed"
harness = false

# The quiche e2e tests only run where the vendored BoringSSL toolchain is
# available and cross-emulated socket tests are practical. Android needs an NDK
# setup that the CI cross image does not provide, FreeBSD's bindgen invocation
# cannot see the cross sysroot, and BoringSSL does not support LoongArch.
# Keep this predicate in sync with the crate-level cfg in the quiche test files.
[target.'cfg(all(target_pointer_width = "64", not(any(target_os = "android", target_os = "freebsd", target_arch = "loongarch64"))))'.dependencies]
tuic-server = { path = "../tuic-server", default-features = false, features = ["quiche"] }
tuic-client = { path = "../tuic-client", default-features = false, features = ["quiche"] }
wind-tuic = { git = "https://github.com/rust-proxy/wind", rev = "12fbf7a690a4f20be6c9c593addf42a670cfc1a5", default-features = false, features = ["quiche"] }
quinn = { workspace = true, default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
