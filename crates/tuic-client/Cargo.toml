[package]
name = "tuic-client"
version.workspace = true
authors.workspace = true
description = "Minimalistic TUIC client implementation as a reference"
categories = ["network-programming"]
keywords = ["network", "proxy", "quic", "tuic"]
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["aws-lc-rs"]
ring = ["rustls/ring", "quinn/rustls-ring", "rcgen/ring"]
aws-lc-rs = ["dep:aws-lc-rs", "rustls/aws-lc-rs", "quinn/rustls-aws-lc-rs", "rcgen/aws_lc_rs"]
jemallocator = ["tikv-jemallocator"]
# The tokio-quiche backend, hosted inside wind-tuic behind its `quiche`
# feature. 64-bit only — tokio-quiche does not compile on 32-bit. Enabled per
# target via `.github/target.toml`; do NOT enable on 32-bit targets.
quiche = ["wind-tuic/quiche"]

[dependencies]

# Wind framework
wind-base = { path = "../wind/crates/wind-base" }
wind-core = { path = "../wind/crates/wind-core" }
wind-socks = { path = "../wind/crates/wind-socks" }
wind-tuic = { path = "../wind/crates/wind-tuic", features = ["client", "quinn"] }

async-trait = "0.1"

bytes = { version = "1", default-features = false, features = ["std"] }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
json5 = { version = "1.3", default-features = false }
toml = "1.0"
figment = { version = "0.10", features = ["toml", "yaml"] }
figment-json5 = "0.1.1"
educe = { version = "0.6", default-features = false, features = ["Default"] }
humantime-serde = "1"

uuid = { version = "1", default-features = false, features = ["serde", "std"] }

# QUIC
quinn = { workspace = true, default-features = false, features = ["runtime-tokio"] }
quinn-congestions = { workspace = true }

# Tokio/Async
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "parking_lot", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["compat", "rt"] }

# TLS
rustls = { version = "0.23", default-features = false }
rustls-native-certs = { version = "0.8", default-features = false }
rustls-pemfile = { version = "2", default-features = false, features = ["std"] }
# Built-in Mozilla root set used when `[tls] disable_native_certs = true`.
webpki-roots = "1"
aws-lc-rs = { version = "1", default-features = false, optional = true, features = ["prebuilt-nasm"] }

# Error-handling
thiserror = { version = "2", default-features = false }
eyre = { version = "0.6" }

# Logging
time = { version = "0.3", features = ["macros", "local-offset"] }
humantime = { version = "2", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["tracing-log", "std", "local-time", "fmt", "ansi"] }
chrono = "0.4"
tracing = "0.1"

tikv-jemallocator = { version = "0.7", optional = true }

[dev-dependencies]
fast-socks5 = { version = "1" }
tempfile = "3"
# Self-signed certificates for the `[tls]` trust-store tests.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem"] }
