[build]
#rustc-wrapper = "sccache"
# Unlocks reqwest's experimental HTTP/3 client. `tuic-tests`'s masquerade e2e
# test (tests/masquerade.rs) pulls reqwest with its `http3` feature as an
# unconditional dependency, so this flag is required for any default build/test
# that compiles `tuic-tests`; it is inert for crates that don't turn on http3.
rustflags = ["--cfg", "reqwest_unstable"]

[env]
# Rust's i686 Linux targets require SSE2. Use the same baseline for BoringSSL.
CFLAGS_i686_unknown_linux_gnu = "-msse2"
CXXFLAGS_i686_unknown_linux_gnu = "-msse2"
CFLAGS_i686_unknown_linux_musl = "-msse2"
CXXFLAGS_i686_unknown_linux_musl = "-msse2"
# The FreeBSD cross GCC exposes ULLONG_MAX through the C++ limits header.
CXXFLAGS_x86_64_unknown_freebsd = "-include climits"
RUSTC_BOOTSTRAP = { value = "1" }
# Standalone Android binaries use the NDK static C++ runtime.
BORING_BSSL_RUST_CPPLIB_aarch64_linux_android = "static:-bundle=c++"
# BoringSSL's default C++ runtime linkage pulls libstdc++.so into musl binaries.
# Resolve the static runtime at the final link using the cross-linker's paths.
BORING_BSSL_RUST_CPPLIB_aarch64_unknown_linux_musl = "static:-bundle=stdc++"
BORING_BSSL_RUST_CPPLIB_armv7_unknown_linux_musleabi = "static:-bundle=stdc++"
BORING_BSSL_RUST_CPPLIB_armv7_unknown_linux_musleabihf = "static:-bundle=stdc++"
BORING_BSSL_RUST_CPPLIB_i686_unknown_linux_musl = "static:-bundle=stdc++"
BORING_BSSL_RUST_CPPLIB_x86_64_unknown_linux_musl = "static:-bundle=stdc++"

[net]
# Fetch the Wind and quiche fork Git dependencies with the `git` CLI instead of
# libgit2. The quiche fork carries a very large number of remote branches and
# its history is tens of MB, which libgit2 fetches slowly; breeze already uses
# the CLI fetcher for the same dependencies.
git-fetch-with-cli = true
