[build]
#rustc-wrapper = "sccache"
# Unlocks reqwest's experimental HTTP/3 client. `tuic-tests`'s masquerade e2e
# test (tests/masquerade.rs) pulls reqwest with its `http3` feature as an
# unconditional dependency, so this flag is required for any default build/test
# that compiles `tuic-tests`; it is inert for crates that don't turn on http3.
rustflags = ["--cfg", "reqwest_unstable"]

[env]
RUSTC_BOOTSTRAP = { value = "1" }