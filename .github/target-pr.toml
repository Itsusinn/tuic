# Reduced build matrix for pull requests.
#
# The full .github/target.toml matrix still runs on pushes to main and on
# release tags. Pull requests only build the targets that catch most breakage,
# because the PR matrix dominates this repository's Actions minutes.

[[target]]
os = "ubuntu-latest"
target = "x86_64-unknown-linux-gnu"
release-name = "x86_64-linux"
tool = "cross"
extra-args = "--features jemallocator"
zig = "2.17"

[[target]]
os = "ubuntu-latest"
target = "x86_64-unknown-linux-musl"
release-name = "x86_64-linux-musl"
tool = "cross"
extra-args = "--features jemallocator"

[[target]]
os = "ubuntu-latest"
target = "aarch64-unknown-linux-gnu"
release-name = "aarch64-linux"
tool = "cross"
extra-args = "--features jemallocator"

[[target]]
os = "windows-latest"
target = "x86_64-pc-windows-msvc"
release-name = "x86_64-windows"
postfix = ".exe"
extra-args = ""

[[target]]
os = "macos-latest"
target = "aarch64-apple-darwin"
release-name = "aarch64-darwin"
extra-args = "--features jemallocator"
