name: CI

on:
  push:
    tags: ["v*"]
    branches: ["main", "next"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  RUST_LOG: "tuic_server=TRACE,tuic_client=TRACE"
  RUST_TOOLCHAIN: "stable"
  RUSTC_BOOTSTRAP: "1"
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  build:
    name: Build
    uses: rust-proxy/workflows/.github/workflows/rust-build.yml@v2.0.4
    secrets:
      sentry-dsn: ${{ secrets.SENTRY_DSN }}
    with:
      rust-toolchain: "stable"
      packages: "tuic-server,tuic-client"
      target-config-file: ".github/target.toml"
      # The reusable workflow exports this as the `RUSTFLAGS` env var, which
      # overrides `.cargo/config.toml [build] rustflags`; mirror the committed
      # `--cfg reqwest_unstable` here so it stays enabled in CI. It is required
      # for the `tuic-tests` masquerade test, whose reqwest dependency turns on
      # the experimental `http3` feature (inert for `tuic-server`/`tuic-client`).
      rustflags: "--cfg reqwest_unstable"
      enable-tmate: false
      enable-sccache: true
      only-clippy-tests-on-pr: false

  release:
    name: Release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    needs: [build]
    uses: rust-proxy/workflows/.github/workflows/release-publish.yml@v2.0.4
    with:
      cliff-config: '.github/cliff.toml'

  docker:
    name: Docker
    needs: [build]
    uses: rust-proxy/workflows/.github/workflows/docker-publish.yml@v2.0.4
    with:
      docker-file: '.github/Dockerfile'
      image-name: 'tuic-server'
      platforms: 'linux/amd64,linux/arm64'
      binary-dir: './docker-bins'
      server-binary-amd64: 'tuic-server-x86_64-linux'
      server-binary-arm64: 'tuic-server-aarch64-linux'
